[project]
name = "mbay-nmt"
version = "0.2.0"
description = "Mbay NMT training + inference pipeline (NLLB-based, Keegan Sara-Bagirmi aux data)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "ndilsou", email = "nasoungadoy@gmail.com" }]
dependencies = [
    "transformers[torch,sentencepiece]>=4.46.0,<5.0",
    "peft>=0.13.0,<1.0",
    "datasets[s3]>=3.0.0,<4.0",
    "accelerate>=1.0.0,<2.0",
    "evaluate>=0.4.3,<1.0",
    "bitsandbytes>=0.44.0,<1.0",
    "safetensors>=0.4.5,<1.0",
    "sacrebleu>=2.4.3,<3.0",
    "sentencepiece>=0.2.0,<1.0",
    "tokenizers>=0.20.0,<1.0",
    "rouge-score>=0.1.2,<1.0",
    "scipy>=1.14.0,<2.0",
    "pydantic>=2.9.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "python-dotenv>=1.0.1,<2.0",
    "rich>=13.9.0,<14.0",
    "wandb>=0.18.0,<1.0",
    "sagemaker>=2.232.0,<3.0",
    "boto3>=1.35.0,<2.0",
    "google-genai>=1.0,<2.0",
    "pyarrow>=17.0.0,<18.0",
    "pandas>=2.2.0,<3.0",
    "regex>=2024.9.0",
    "tqdm>=4.66.0,<5.0",
    "lxml>=5.3.0,<6.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "psycopg[binary]>=3.2.0,<4.0",
    "scikit-learn>=1.8.0",
    "fastapi>=0.115.0,<1.0",
    "mangum>=0.19.0,<1.0",
    "uvicorn>=0.32.0,<1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.3.0",
    "ipython>=8.28.0",
    "ipywidgets>=8.1.5",
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-xdist>=3.6.0",
    "poethepoet>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["components/mbay_nmt", "bases/mbay_nmt"]

[tool.hatch.build.targets.wheel.force-include]
"components/mbay_nmt" = "mbay_nmt"
"bases/mbay_nmt" = "mbay_nmt"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.poe.tasks]
typecheck = "ruff check ."
fmt = "ruff format ."
test = "pytest -n auto"
build-project = { sequence = [
  { shell = "uv export --no-hashes --no-header --no-dev --no-emit-workspace -o ./projects/${project}/requirements.txt" },
  { shell = "uv build --wheel ./projects/${project}" },
], args = [
  { name = "project", positional = true },
] }
